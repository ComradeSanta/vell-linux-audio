# Vell: every re-open of the speaker PCM re-runs the CS35L41 amp power-up
# handshake, which is flaky (PUP_DONE -110 on first attempt per stream).
# Keep the device open instead of suspending it after idle timeout.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3-platform-adl_cs35l41.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
