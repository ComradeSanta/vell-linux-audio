# Vell (HP Dragonfly Pro): SOF pipeline is native 48 kHz — run the graph
# at 48k and resample anything else at high quality instead of re-clocking
# the whole graph for 44.1 kHz material.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    resample.quality            = 10
}
